name: Notification system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notification_user
          POSTGRES_PASSWORD: notification_secret
          POSTGRES_DB: notification_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://notification_user:notification_secret@localhost:5432/notification_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache: true}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.5.0}
      - run: go test -count=1 -v -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
